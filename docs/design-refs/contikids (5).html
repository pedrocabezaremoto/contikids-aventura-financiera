<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>ContiKids · Aventura financiera</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--a:#6fcfd4;--b:#e3f6f7;--c:#fff;--i:#061859;--s:rgba(6,24,89,.18);--m:#4b5877;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--a:#14307a;--b:#0a1238;--c:#1b2a63;--i:#f2f6ff;--s:rgba(0,0,0,.4);--m:#b6c2e6}}
:root[data-theme=dark]{--a:#14307a;--b:#0a1238;--c:#1b2a63;--i:#f2f6ff;--s:rgba(0,0,0,.4);--m:#b6c2e6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--a),var(--b)) fixed;color:var(--i);font:700 18px Quicksand,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",system-ui,sans-serif}
h1,h2,h3,.wm,.dm,.btn,.pill,.lb b{font-family:Montserrat,"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",system-ui,sans-serif;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ecc911;outline-offset:3px}
#top{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}.sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border:0;border-radius:30px;background:var(--c);color:var(--i);box-shadow:0 5px 0 var(--s);font-size:17px}
.pill.red{color:#ec1125}.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;margin-left:-12px}
#app{max-width:1100px;margin:0 auto;padding:8px 16px 120px}
.card{background:var(--c);border-radius:28px;box-shadow:0 6px 0 var(--s);padding:24px;max-width:760px;margin:12px auto}.c{text-align:center}
.wm{font-size:clamp(36px,8vw,64px);letter-spacing:1px;margin:0}.sl{color:#d58a24;font-size:22px;margin:0 0 16px}
.big{font-size:64px;line-height:1.2}.tx{font-size:22px;line-height:1.45;margin:8px 0 16px}.r{color:var(--m);font-size:20px}
.btn{min-height:56px;padding:0 26px;border:0;border-radius:28px;background:#3e6aa8;color:#fff;box-shadow:0 5px 0 #2a4c7e;font-size:18px;margin:6px}.btn.g{background:#2e9ca3;box-shadow:0 5px 0 #1f6e73}
.row{display:flex;flex-wrap:wrap;justify-content:center}
.pf{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.pf button{width:150px;padding:18px 10px;border:0;border-radius:24px;background:var(--c);color:var(--i);box-shadow:0 6px 0 var(--s);font-size:20px}
.av2{width:84px;height:84px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 38px Montserrat,sans-serif}
.pd{display:flex;gap:12px;justify-content:center;margin:12px}.pd b,.dots b{width:20px;height:20px;border-radius:50%;border:3px solid var(--i)}.pd b.on,.dots b.on{background:#7ed957}.dots{display:flex;gap:8px;justify-content:center;margin:8px}.dots b{width:14px;height:14px}
.kp{display:grid;grid-template-columns:repeat(3,84px);gap:10px;justify-content:center}.kp button{height:68px;border:0;border-radius:20px;background:#a6cbf5;color:#061859;font:800 28px Montserrat,sans-serif;box-shadow:0 4px 0 #6f9ad0}.kp button:disabled{opacity:.35}
.map{position:relative;height:min(68vh,540px);min-height:400px}.map svg{position:absolute;inset:0;width:100%;height:100%}
.map path{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke}.dt{stroke:#fff;stroke-width:10;stroke-dasharray:1 22}.dn{stroke:#f3e3b3;stroke-width:22}
.cl{position:absolute;width:150px;height:44px;border-radius:22px;background:#fff;opacity:.85;animation:dr 16s ease-in-out infinite alternate}@keyframes dr{to{transform:translateX(46px)}}
.nd{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.dm{position:relative;width:clamp(62px,9vw,92px);aspect-ratio:1;border:0;background:none;font-size:clamp(20px,3vw,28px)}
.dm::before{content:"";position:absolute;inset:10%;border-radius:22%;background:var(--k);transform:rotate(45deg);box-shadow:0 8px 0 var(--s2);transition:transform .15s}.dm:hover::before{transform:rotate(45deg) scale(1.08)}.dm span{position:relative}
.cur::after{content:"";position:absolute;inset:10%;border:4px solid var(--k);border-radius:22%;animation:pl 1.8s ease-out infinite}@keyframes pl{from{transform:rotate(45deg);opacity:.9}to{transform:rotate(45deg) scale(1.6);opacity:0}}
.sk{animation:sk .45s}@keyframes sk{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lb{margin-top:10px;padding:6px 12px;border-radius:16px;background:var(--c);box-shadow:0 4px 0 var(--s);text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}.lb b{font-size:15px}.lb small{font-size:13px;color:var(--m)}
.lb u{display:flex;gap:5px;text-decoration:none}.lb i{width:11px;height:11px;border-radius:50%;border:2px solid var(--i)}.lb i.on{background:#7ed957}
@media(max-width:700px){.lb small{display:none}.lb b{font-size:12px}}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.hd h1{margin:0;font-size:clamp(22px,4vw,34px)}
.ws{display:flex;align-items:center;gap:12px;margin:16px 0}.bub{background:var(--c);padding:12px 18px;border-radius:20px;box-shadow:0 4px 0 var(--s);margin:0}
.st{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;margin-top:24px}.nd2{display:flex;flex-direction:column;align-items:center;width:150px}.nd2 .dm{width:120px}.nd2 small{color:var(--m)}
.opts{display:grid;gap:12px}.opt,.chip{min-height:64px;padding:12px 18px;border:3px solid var(--i);border-radius:20px;background:var(--c);color:var(--i);font-size:20px;text-align:left}.opt.ok{background:#7ed957;color:#061859}.opt.no{background:#ffd1d1;color:#061859}
.chips{display:flex;flex-wrap:wrap;gap:12px;min-height:70px;margin-bottom:16px}.chip{cursor:grab}.chip.sel{background:#ecc911;color:#061859}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.box{min-height:150px;padding:12px;border:4px dashed var(--i);border-radius:24px}.box h3{margin:0 0 8px;font-size:20px}.in{display:inline-block;margin:4px;padding:6px 12px;border-radius:14px;background:#7ed957;color:#061859;font-size:16px}
.bal{position:relative;height:230px;margin:16px 0}.beam{position:absolute;left:8%;right:8%;top:50px;height:10px;border-radius:5px;background:#d58a24;transition:transform .3s}.pan{position:absolute;top:10px;width:130px;transform:translateX(-50%);text-align:center;transition:transform .3s}.pan div{margin-top:12px;padding:10px;border-radius:16px;background:var(--c);border:3px solid var(--i)}
.post{position:absolute;left:50%;top:50px;width:12px;height:150px;margin-left:-6px;background:#d58a24;border-radius:6px}
.stp{display:flex;align-items:center;justify-content:center;gap:14px;font:800 36px Montserrat,sans-serif}.stp button{width:64px;height:64px;border:0;border-radius:50%;background:#ecc911;color:#061859;font-size:34px}
#t{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none}.toast{display:flex;align-items:center;gap:12px;max-width:560px;padding:8px 22px 8px 10px;border-radius:30px;border:3px solid #ecc911;background:#fff9db;color:#061859;box-shadow:0 8px 24px var(--s)}.toast.ok{background:#f1fceb;border-color:#7ed957}
.cf{position:fixed;top:-30px;font-size:26px;pointer-events:none;animation:fall 1.2s ease-in forwards}@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body::before{content:"";position:fixed;top:78px;right:7%;width:84px;height:84px;border-radius:50%;background:#ffe066;box-shadow:0 0 0 14px rgba(255,224,102,.35),0 0 70px #ffe066;z-index:-1;animation:fl 4s ease-in-out infinite alternate}
body::after{content:"";position:fixed;left:-5%;right:-5%;bottom:-40px;height:110px;border-radius:50% 50% 0 0;background:#7ed957;box-shadow:inset 0 12px 0 #5dae3c;z-index:-1}
.fl{animation:fl 3s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-12px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}@keyframes np{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
.iso{width:min(330px,75%);display:block;margin:0 auto -6px;filter:drop-shadow(0 8px 0 var(--s))}
.card{border:3px solid rgba(255,255,255,.7);animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.pf button{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;transition:transform .2s}.pf button:nth-child(2){animation-delay:.1s}.pf button:nth-child(3){animation-delay:.2s}.pf button:hover{transform:translateY(-8px) rotate(-3deg)}
.nd{animation:np .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0s)}
.isl{position:absolute;top:clamp(48px,6.5vw,68px);left:50%;width:clamp(120px,16vw,180px);height:46px;transform:translateX(-50%);border-radius:50%;background:#7ed957;box-shadow:inset 0 -7px 0 #5dae3c,0 16px 0 -3px #a06a40;z-index:-1}
.pg{position:absolute;top:calc(-1 * clamp(44px,6vw,62px));width:clamp(40px,5.5vw,58px);animation:hop .9s ease-in-out infinite alternate;z-index:2;pointer-events:none}@keyframes hop{to{transform:translateY(-14px) rotate(-7deg)}}
.wd{filter:drop-shadow(0 4px 0 var(--s));animation:fl 2.4s ease-in-out infinite alternate}
.toast{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}.toast .wd{animation:none}
.br{display:flex;align-items:center;gap:8px;font:800 22px Montserrat,sans-serif;color:var(--i)}.br img{height:46px}.br b{color:#ec1125}
.nd2{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}.nd2:nth-child(2){animation-delay:.12s}.nd2:nth-child(3){animation-delay:.24s}
.cn{position:absolute;font-size:26px;animation:fl 2.5s ease-in-out infinite alternate;opacity:.9}
.sc{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;padding:18px;margin:12px 0;border-radius:24px;background:linear-gradient(180deg,#dff4ff,#fff7d6);color:#061859;min-height:100px;box-shadow:inset 0 -10px 0 rgba(125,217,87,.4)}
.si{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both,fl 2.2s ease-in-out infinite alternate;animation-delay:var(--d),calc(var(--d) + .5s)}.e{font-size:46px;line-height:1}img.si{height:68px}
.ar{font-size:30px;color:#3e6aa8;animation:ar 1s ease-in-out infinite alternate}@keyframes ar{to{transform:translateX(8px)}}
.co{display:inline-block;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ecc911 45%,#d58a24);border:3px solid #b8791a;box-shadow:0 4px 0 #b8791a;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}.co.cn{animation:fl 2.5s ease-in-out infinite alternate}
.tg{padding:8px 16px;border-radius:20px;font:800 18px Montserrat,sans-serif;color:#061859;box-shadow:0 4px 0 rgba(6,24,89,.2);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}.hl{animation:sk .45s}
.fb{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:22px;margin:10px 0;border:3px solid #ecc911;background:#fff9db;color:#061859;animation:pop .35s both}.fb.ok{background:#f1fceb;border-color:#7ed957}.fb p{margin:4px 0 8px;font-size:19px;line-height:1.4}.fb b{font-family:Montserrat,sans-serif}

function vPerfil(){app.innerHTML=`<section class="card c">${WM}<h2>¿Quién va a jugar hoy?</h2><div class="pf">${Object.keys(P).map(k=>`<button onclick="sel='${k}';go('pin')"><div class="av2" style="background:${P[k]}">${k[0]}</div>${k}</button>`).join('')}</div></section>`}

if(v=='1234'){U=sel;D[U]=D[U]||{p:[0,0,0,0,0],xp:0};fl=0;sv();go('mapa')}else{v='';if(++fl>=3){fl=0;lk=Date.now()+20000;later(d,20100);say('Waddles se tomó un descanso. ¡Inténtalo en 20 segundos!','warn')}else say('¡Uy! Ese PIN no es. Inténtalo otra vez 🐧','warn');d()}});

app.innerHTML=`<div class="map"><div class="cl" style="left:4%;top:6%"></div><i class="co cn" style="left:20%;top:20%"></i><i class="co cn" style="left:58%;top:14%;animation-delay:.6s"></i><span class="cn" style="left:80%;top:84%;animation-delay:1.1s">⭐</span><div class="cl" style="left:62%;top:2%;animation-duration:20s"></div><div class="cl" style="left:30%;top:88%;animation-duration:18s"></div><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${segs}</svg>${C.map((c,i)=>{const o=un(i),d=p[i]>=3;return `<div class="nd" style="left:${X[i]}%;top:${Y[i]}%;--d:${i*.12}s"><div class="isl"></div>${i==cur?`<img class="pg" src="${PIG}" alt="">`:''}<button class="dm${i==cur?' cur':''}" style="--k:${o?c.col:'#b9c1cf'};--s2:${o?c.sh:'#8d97a8'};color:${o?c.ink:'#2f3a55'}" aria-label="Capítulo ${c.n}, ${o?(d?'completado':'disponible'):'bloqueado'}" onclick="op(${i},this)"><span>${!o?IC.l:d?'✓':c.n}</span></button><div class="lb"><b>Cap. ${c.n}</b><small>${c.name}</small><u>${[0,1,2].map(j=>`<i class="${o&&p[i]>j?'on':''}"></i>`).join('')}</u></div></div>`}).join('')}</div>`;
if(!D[U].xp)say('¡Hola '+U+'! Toca el capítulo que brilla para empezar 🌟','ok')}

const IC=[SV('<path d="M3 5.5C5.5 4.5 9 4.5 12 6.5c3-2 6.5-2 9-1V19c-2.5-1-6-1-9 1-3-2-6.5-2-9-1z"/><path d="M12 6.5V20"/>'),SV('<circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.4-2.8 4"/><path d="M12 17.5v.01"/>'),SV('<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a1 1 0 0 0-1 1c0 2.2 1.6 3.8 4 4M16 6h3a1 1 0 0 1 1 1c0 2.2-1.6 3.8-4 4"/><path d="M12 13v4M8.5 20h7M10 17h4"/>')];

function theme(N){const k=C[N].k;let i=0;const d=()=>{app.innerHTML=`<section class="card c"><p class="r">Aprende con un ejemplo real · ${i+1} de 3</p>${SC(k[i][0])}<p class="tx">${k[i][1]}</p><div class="dots">${k.map((_,j)=>`<b class="${j<=i?'on':''}"></b>`).join('')}</div><div class="row">${i?'<button class="btn g" id="pv">← Atrás</button>':'<button class="btn g" onclick="go(\'cap-'+N+'\')">← Salir</button>'}<button class="btn" id="nx">${i<2?'Siguiente ➜':'¡Listo!'}</button></div></section>`;

function bal(N){const H=[12,15,9][Math.random()*3|0],O=[5,6,4][Math.random()*3|0];let m=0,ok=0;
