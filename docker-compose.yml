# CONTIKIDS — un solo compose para el VPS y para la laptop de la demo.
#   VPS:    WEB_BIND=172.18.0.1  WEB_PORT=4400  (solo lo alcanza Traefik)
#   Laptop: WEB_BIND=127.0.0.1   WEB_PORT=80    → http://localhost
# Desarrollo (pnpm dev): basta con `docker compose up -d postgres`.
name: contikids

services:
  postgres:
    image: postgres:16-alpine
    container_name: contikids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    ports:
      # Solo localhost, nunca 0.0.0.0 (los puertos de Docker se saltan UFW).
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: contikids-api:latest
    container_name: contikids-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # 0.0.0.0 DENTRO del contenedor: la api no se publica al host, solo la ve la red del compose.
      API_HOST: 0.0.0.0
      API_PORT: 4410
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
    # Sin "ports": la api NO se publica.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4410/api/v1/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: contikids-web:latest
    container_name: contikids-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-80}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m

volumes:
  pgdata:
